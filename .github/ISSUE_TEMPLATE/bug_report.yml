name: Bug report
description: Something in Framework Unitframes doesn't work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: client
    attributes:
      label: Game Client
      options: [Retail (12.x), WoW Forever (1.60.x)]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Framework Unitframes version
      placeholder: "e.g. 2.0.0 (shown in /fw)"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Lua error text (BugSack / BugGrabber), if any
      render: text
  - type: textarea
    id: profile
    attributes:
      label: Exported profile string (optional)
      description: "Open /fw -> Profiles -> Export and paste your profile string here if the issue is layout-specific."
